<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">

    <title>Admin Login</title>

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link rel="stylesheet" href="admin.css">
</head>

<body>

    <h1>Admin Login</h1>

    <form id="loginForm">

        <label>
            Username
        </label>

        <input
            type="text"
            id="username"
            required
        >

        <label>
            Password
        </label>

        <input
            type="password"
            id="password"
            required
        >

        <button type="submit">
            Login
        </button>

        <p id="loginMessage"></p>

    </form>

    <script type="module" src="login.js"></script>

</body>

</html>
