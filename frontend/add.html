<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">

    <title>Add Content</title>

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link rel="stylesheet" href="style.css">
</head>


<body>

    <h1>Add Movie / Series</h1>


    <form id="addForm">

        <!-- Type -->

        <label>
            Type
        </label>

        <select id="type" required>

            <option value="movie">
                Movie
            </option>

            <option value="series">
                Series
            </option>

        </select>


       <!-- Poster -->

     <label>
        Poster
    </label>

    <img
       id="posterPreview"
       class="poster-preview"
       alt="Poster preview"
    >

   <input
      type="file"
      id="poster"
      accept="image/*"
      required
    >


        <!-- Title -->

        <label>
            Title
        </label>

        <input
            type="text"
            id="title"
            required
        >


        <!-- Genres -->

<label>
    Genres
</label>

<div id="genreGroup">

    <label>
        <input type="checkbox" value="Action">
        Action
    </label>

    <label>
        <input type="checkbox" value="Adventure">
        Adventure
    </label>

    <label>
        <input type="checkbox" value="Comedy">
        Comedy
    </label>

    <label>
        <input type="checkbox" value="Drama">
        Drama
    </label>

    <label>
        <input type="checkbox" value="Horror">
        Horror
    </label>

    <label>
        <input
            type="checkbox"
            value="Science Fiction (Sci-Fi)"
        >
        Science Fiction (Sci-Fi)
    </label>

    <label>
        <input
            type="checkbox"
            value="Fantasy"
        >
        Fantasy
    </label>

    <label>
        <input
            type="checkbox"
            value="Thriller / Suspense"
        >
        Thriller / Suspense
    </label>

    <label>
        <input
            type="checkbox"
            value="Romance"
        >
        Romance
    </label>

    <label>
        <input
            type="checkbox"
            value="Western"
        >
        Western
    </label>

    <label>
        <input
            type="checkbox"
            value="Documentary"
        >
        Documentary
    </label>

    <label>
        <input
            type="checkbox"
            value="Animation"
        >
        Animation
    </label>

    <label>
        <input
            type="checkbox"
            value="Musical"
        >
        Musical
    </label>

    <label>
        <input
            type="checkbox"
            value="Crime / Noir"
        >
        Crime / Noir
    </label>

    <label>
        <input
            type="checkbox"
            value="Mystery"
        >
        Mystery
    </label>

    <label>
        <input
            type="checkbox"
            value="War"
        >
        War
    </label>

</div>


<!-- Categories -->

<label>
    Categories
</label>

<div id="categoryGroup">

    <label>
        <input type="checkbox" value="Hollywood">
        Hollywood
    </label>

    <label>
        <input type="checkbox" value="Bollywood">
        Bollywood
    </label>

    <label>
        <input type="checkbox" value="Korea">
        Korea
    </label>

    <label>
        <input type="checkbox" value="China">
        China
    </label>

    <label>
        <input type="checkbox" value="Thailand">
        Thailand
    </label>

    <label>
        <input type="checkbox" value="Japan">
        Japan
    </label>

    <label>
        <input type="checkbox" value="Animation">
        Animation
    </label>

    <label>
        <input type="checkbox" value="Other">
        Other
    </label>

</div>

        <!-- Year -->

        <label>
            Year
        </label>

        <input
            type="number"
            id="year"
        >


        <!-- Telegram Link -->

        <label>
            Telegram Link
        </label>

        <input
            type="url"
            id="link"
        >


        <!-- Review -->

        <label>
            Review
        </label>

        <textarea
            id="review"
            rows="8"
        ></textarea>


        <!-- File Size -->

        <label>
            File Size
        </label>

        <input
            type="text"
            id="fileSize"
            placeholder="Example: 1.56GB"
        >


        <!-- Quality -->

        <label>
            Quality
        </label>

        <input
            type="text"
            id="quality"
            placeholder="Example: 1080P"
        >


        <!-- Duration -->

     <div id="durationGroup">

      <label>
           Duration
      </label>

      <input
        type="text"
        id="duration"
        placeholder="Example: 1hr 59min"
    >

     </div>


        <!-- Episodes -->

        <div id="episodesGroup">

     <label>
        Episodes
     </label>

    <input
        type="number"
        id="episodes"
        placeholder="Example: 41"
    >

     </div>

        <!-- Rating -->

        <label>
            Rating
        </label>

        <input
            type="text"
            id="rating"
            placeholder="Example: 7.2/10"
        >


        <button type="submit">
            Add Content
        </button>

    </form>


    <script type="module" src="add.js"></script>

</body>

</html>
