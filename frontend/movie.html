<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Movie Details</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="movie-details">

      <img id="moviePoster" src="" alt="Movie Poster">

<div class="movie-info">
    <h1 id="movieTitle"></h1>

    <p id="movieYear"></p>

  <p id="movieCategory" class="movie-type"></p>

    <p id="movieReview" class="movie-review"></p>
<div class="movie-meta">
    <div>
        <span>File Size</span>
        <p id="movieFileSize"></p>
    </div>

    <div>
        <span>Quality</span>
        <p id="movieQuality"></p>
    </div>

    <div>
       <span id="movieDurationLabel">Duration</span>
       <p id="movieDuration"></p>
    </div>
    <div>
        <span>Rating</span>
        <p id="movieRating"></p>
    </div>
         
</div>

<a id="watchButton" href="">Watch Now</a>
<button id="saveButton">🔖 Save Movie</button>
<button id="backButton">Back to Movies</button>
</div>

    </div>
    <script type="module" src="movie.js"></script>

</body>
</html>
