<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">

    <title>Edit Content</title>

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link rel="stylesheet" href="edit.css">
</head>

<body>

    <h1>Edit Movie / Series</h1>

    <form id="editForm">

        <label>Type</label>
        <select id="type" required>
            <option value="movie">Movie</option>
            <option value="series">Series</option>
        </select>

        <!-- Poster -->

       <label>Poster</label>

       <img
         id="posterPreview"
         class="poster-preview"
         alt="Current poster"
        >

       <input
         type="file"
         id="poster"
         accept="image/*"
        >

        <label>Title</label>
        <input type="text" id="title" required>

        <!-- Genres -->

<label>
    Genres
</label>

<div id="genreGroup">

    <label>
        <input type="checkbox" value="Action">
        Action
    </label>

    <label>
        <input type="checkbox" value="Adventure">
        Adventure
    </label>

    <label>
        <input type="checkbox" value="Comedy">
        Comedy
    </label>

    <label>
        <input type="checkbox" value="Drama">
        Drama
    </label>

    <label>
        <input type="checkbox" value="Horror">
        Horror
    </label>

    <label>
        <input
            type="checkbox"
            value="Science Fiction (Sci-Fi)"
        >
        Science Fiction (Sci-Fi)
    </label>

    <label>
        <input type="checkbox" value="Fantasy">
        Fantasy
    </label>

    <label>
        <input
            type="checkbox"
            value="Thriller / Suspense"
        >
        Thriller / Suspense
    </label>

    <label>
        <input type="checkbox" value="Romance">
        Romance
    </label>

    <label>
        <input type="checkbox" value="Western">
        Western
    </label>

    <label>
        <input type="checkbox" value="Documentary">
        Documentary
    </label>

    <label>
        <input type="checkbox" value="Animation">
        Animation
    </label>

    <label>
        <input type="checkbox" value="Musical">
        Musical
    </label>

    <label>
        <input
            type="checkbox"
            value="Crime / Noir"
        >
        Crime / Noir
    </label>

    <label>
        <input type="checkbox" value="Mystery">
        Mystery
    </label>

    <label>
        <input type="checkbox" value="War">
        War
    </label>

</div>


<!-- Categories -->

    <label>
    Categories
    </label>

<div id="categoryGroup">

     <label>
        <input type="checkbox" value="Hollywood">
        Hollywood
     </label>

     <label>
        <input type="checkbox" value="Bollywood">
        Bollywood
     </label>

     <label>
        <input type="checkbox" value="Korea">
         Korea
     </label>

     <label>
        <input type="checkbox" value="China">
        China
     </label>

     <label>
        <input type="checkbox" value="Thailand">
        Thailand
     </label>

     <label>
        <input type="checkbox" value="Japan">
        Japan
     </label>

     <label>
        <input type="checkbox" value="Animation">
        Animation
     </label>

     <label>
        <input type="checkbox" value="Other">
        Other
     </label>

</div>

        <label>Year</label>
        <input type="number" id="year">

        <label>Review</label>
        <textarea id="review" rows="8"></textarea>

        <label>File Size</label>
        <input type="text" id="fileSize">

        <label>Quality</label>
        <input type="text" id="quality">

        <div id="durationGroup">

            <label>Duration</label>

            <input
                type="text"
                id="duration"
            >

        </div>

        <div id="episodesGroup">

            <label>Planned / Total Episodes (optional)</label>

            <input
                type="number"
                id="episodes"
            >

        </div>

        <div id="seriesStatusGroup" hidden>
            <label for="seriesStatus">Status</label>
            <select id="seriesStatus">
                <option value="">Choose status</option>
                <option value="ongoing">Ongoing</option>
                <option value="completed">Completed</option>
            </select>
        </div>

        <label>Rating</label>
        <input type="text" id="rating">

        <button type="submit">
            Save Changes
        </button>

    </form>

    <section id="telegramMappingSection" hidden>
        <h2>Telegram Mapping</h2>
        <form id="telegramMappingForm">
            <label for="telegramChatId">Telegram Chat ID</label>
            <input type="text" id="telegramChatId" required>
            <label for="telegramMessageId">Telegram Message ID</label>
            <input type="number" id="telegramMessageId" min="1" step="1" required>
            <button type="submit">Save Mapping</button>
            <p id="telegramMappingMessage" role="status"></p>
        </form>
    </section>

    <section id="episodeManagementSection" hidden>
        <h2>Episode Management</h2>
        <p id="episodeAvailabilitySummary" role="status"></p>
        <p id="episodeAvailabilityNotice"></p>
        <button id="refreshEpisodesButton" type="button">Refresh Episodes</button>
        <div id="mappedEpisodeList"></div>
        <form id="episodeMappingForm">
            <label for="episodeNumber">Episode Number</label>
            <input type="number" id="episodeNumber" min="1" step="1" required>
            <label for="episodeChatId">Telegram Chat ID</label>
            <input type="text" id="episodeChatId" required>
            <label for="episodeMessageId">Telegram Message ID</label>
            <input type="number" id="episodeMessageId" min="1" step="1" required>
            <button type="submit">Save Episode Mapping</button>
        </form>
        <p id="episodeManagementMessage" role="status"></p>
    </section>

    <script type="module" src="edit.js"></script>

</body>

</html>
