<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Nemo Movie</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar">

        <h2 id="title">🎬 Nemo Movie</h2>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="index.html?type=movie">Movies</a>
            <a href="index.html?type=series">Series</a>
            <a href="my-list.html">My List</a>
        </div>

        <div class="search-box">
            <input id="searchInput" type="text" placeholder="Search movies...">
            <button id="searchBtn">Search</button>
        </div>

    </nav>


<!-- Categories -->

<div class="category-filter">

    <button data-category="all">
        All
    </button>

    <button data-category="Hollywood">
        Hollywood
    </button>

    <button data-category="Bollywood">
        Bollywood
    </button>

    <button data-category="Korea">
        Korea
    </button>

    <button data-category="China">
        China
    </button>

    <button data-category="Thailand">
        Thailand
    </button>

    <button data-category="Japan">
        Japan
    </button>

    <button data-category="Animation">
        Animation
    </button>

    <button data-category="Other">
        Other
    </button>

</div>


<div class="movie-container">
    <!-- Movie cards are created by JavaScript -->
</div>

    <div id="noResults" style="display: none;">
        <h2 style="color: white;">
            No movies found for "<span id="searchTerm"></span>"
        </h2>

        <p>Try another title or keyword.</p>
    </div>

    <script type="module" src="script.js"></script>

</body>
</html>
